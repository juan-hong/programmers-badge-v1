name: trigger_action

on:
  push:
    branches: ['master', 'main']
  schedule:
    # 매일 한국 시간 09:00 (UTC 00:00) 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화
  repository_dispatch:
    types: [trigger-workflow]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build TypeScript project
        run: npm run build

      - name: Run Programmers Badge Service
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPOSITORY: ${{ secrets.GH_REPOSITORY }}
          PROGRAMMERS_ID: ${{ secrets.PROGRAMMERS_ID }}
          PROGRAMMERS_PW: ${{ secrets.PROGRAMMERS_PW }}
        run: |
          # 빌드된 js 실행 (또는 package.json의 start 스크립트 실행)
          node dist/main.js

      - name: Workflow completed
        run: echo "Programmers badge execution finished!"
