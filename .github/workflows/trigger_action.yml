name: trigger_action

on:
  push:
    branches: ['master', 'main']
  schedule:
    # 매일 한국 시간 오전 9시(UTC 00:00)에 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 [Run workflow] 버튼으로 수동 실행 가능
  repository_dispatch:
    types: [trigger-workflow]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build application
        run: npm run build

      - name: Create .env file
        run: |
          touch .env
          echo "GH_PAT=${{ secrets.GH_PAT }}" >> .env
          echo "GH_REPOSITORY=${{ secrets.GH_REPOSITORY }}" >> .env
          echo "PROGRAMMERS_ID=${{ secrets.PROGRAMMERS_ID }}" >> .env
          echo "PROGRAMMERS_PW=${{ secrets.PROGRAMMERS_PW }}" >> .env

      - name: Run application
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPOSITORY: ${{ secrets.GH_REPOSITORY }}
          PROGRAMMERS_ID: ${{ secrets.PROGRAMMERS_ID }}
          PROGRAMMERS_PW: ${{ secrets.PROGRAMMERS_PW }}
        run: |
          # 백그라운드(&) 및 sleep 없이 끝까지 완료되도록 동기 실행합니다.
          npm run start

      - name: Workflow finished
        run: echo "Workflow executed successfully!"
